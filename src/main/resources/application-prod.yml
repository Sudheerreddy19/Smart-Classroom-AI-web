spring:
  application:
    name: Smart AI Classroom

  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}

    hikari:
      pool-name: SmartClassroomPool
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    show-sql: false

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2:3b}

server:
  port: ${PORT:8080}

  error:
    include-message: never
    include-binding-errors: never

logging:
  level:
    com.finalYear: INFO
    org.springframework: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
    org.flywaydb: INFO

  file:
    name: logs/smart-classroom.log

app:
  jwt:
    # No fallback here on purpose: prod must fail fast if JWT_SECRET is missing.
    secret: ${JWT_SECRET}

  cors:
    allowed-origins:
      - ${CORS_ORIGINS:https://smartclassroom.example.com}

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://mosquitto:1883}
  client-id: smart-classroom-backend
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:dominion}
  secret-key: ${MINIO_SECRET_KEY:dominion}
  bucket-name: ${MINIO_BUCKET:smart-classroom}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false